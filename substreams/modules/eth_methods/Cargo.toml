[package]
name = "eth_methods"
version = "0.1.0"
edition = "2021"
description = "Diagnostic Substreams exercising the firehose-ethereum eth_call and eth_getBalance WASM extensions"
publish = false

[dependencies]
substreams = "0.7"
substreams-ethereum = "0.11"
prost = "0.13"
hex = "0.4"
ethabi = "17"

[build-dependencies]
substreams-ethereum = "0.11"

# WASM imports are resolved when a module is instantiated, not when the import is called, so a
# `fireeth` instance that registers neither `rpc::eth_call` nor `rpc::eth_get_balance` refuses to
# instantiate any wasm referencing them, whatever the module being run. Both extensions are
# registered independently, on `--substreams-rpc-endpoints` and
# `--substreams-rpc-get-balance-endpoints` respectively, so a single wasm would make every module
# of this package unusable as soon as one of the two flags is missing.
#
# Each binary under `src/bin` therefore holds the handlers needing one given extension, and this
# library only the code they share. `substreams.yaml` then points each module at the binary it
# belongs to, leaving a missing endpoint to fail that module alone.
[lib]
crate-type = ["rlib"]

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
