version: v1
plugins:
    - plugin: buf.build/protocolbuffers/go:v1.31.0
      out: types/pb
      opt:
          - paths=import
          - module=github.com/streamingfast/firehose-ethereum/types/pb
    - plugin: buf.build/grpc/go:v1.5.1
      out: types/pb
      opt:
          - paths=import
          - module=github.com/streamingfast/firehose-ethereum/types/pb
